<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4-Letter Wordle Activity</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div>
          <h1>WORDLE</h1>
          <p id="subtitle">4-letter daily Discord Activity</p>
        </div>
        <button id="newGameButton" class="small-button">Reset</button>
      </header>

      <main>
        <section id="board" class="board" aria-label="Wordle board"></section>
        <p id="message" class="message"></p>
        <section id="keyboard" class="keyboard" aria-label="Keyboard"></section>

        <section class="footer-actions">
          <button id="shareButton" class="action-button">Copy Result</button>
          <button id="revealButton" class="action-button danger">Reveal</button>
        </section>
      </main>
    </div>

    <script>
const MAX_GUESSES = 6;
const WORD_LENGTH = 4;

const STATUS_RANK = {
  unknown: 0,
  absent: 1,
  present: 2,
  correct: 3,
};

const KEY_ROWS = [
  "QWERTYUIOP".split(""),
  "ASDFGHJKL".split(""),
  ["ENTER", ..."ZXCVBNM".split(""), "⌫"],
];

const STORAGE_PREFIX = "discord-activity-wordle";

let gameDate = "";
let board = [];
let guesses = [];
let scores = [];
let currentGuess = "";
let currentRow = 0;
let gameOver = false;
let keyboardStatus = {};
let lastOutcome = "";

const boardEl = document.querySelector("#board");
const keyboardEl = document.querySelector("#keyboard");
const messageEl = document.querySelector("#message");
const subtitleEl = document.querySelector("#subtitle");
const newGameButton = document.querySelector("#newGameButton");
const shareButton = document.querySelector("#shareButton");
const revealButton = document.querySelector("#revealButton");

async function apiFetch(path, options = {}) {
  const response = await fetch(path, options);

  if (!response.ok) {
    let errorText = `HTTP ${response.status}`;
    try {
      const data = await response.json();
      errorText = data.error || errorText;
    } catch {}
    throw new Error(errorText);
  }

  return response.json();
}

async function getConfig() {
  return apiFetch("./api/config");
}

function storageKey() {
  return `${STORAGE_PREFIX}:${gameDate}`;
}

function emptyBoard() {
  return Array.from({ length: MAX_GUESSES }, () =>
    Array.from({ length: WORD_LENGTH }, () => ({ letter: "", status: "" }))
  );
}

function resetState() {
  board = emptyBoard();
  guesses = [];
  scores = [];
  currentGuess = "";
  currentRow = 0;
  gameOver = false;
  keyboardStatus = {};
  lastOutcome = "";
}

function saveState() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify({
      board,
      guesses,
      scores,
      currentGuess,
      currentRow,
      gameOver,
      keyboardStatus,
      lastOutcome,
    }));
  } catch {}
}

function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(storageKey());
  } catch {
    return false;
  }

  if (!raw) return false;

  try {
    const saved = JSON.parse(raw);
    board = saved.board || emptyBoard();
    guesses = saved.guesses || [];
    scores = saved.scores || [];
    currentGuess = saved.currentGuess || "";
    currentRow = saved.currentRow || 0;
    gameOver = Boolean(saved.gameOver);
    keyboardStatus = saved.keyboardStatus || {};
    lastOutcome = saved.lastOutcome || "";
    return true;
  } catch {
    return false;
  }
}

function renderBoard() {
  boardEl.innerHTML = "";

  for (let r = 0; r < MAX_GUESSES; r++) {
    const rowEl = document.createElement("div");
    rowEl.className = "row";

    for (let c = 0; c < WORD_LENGTH; c++) {
      const tile = board[r][c];
      const tileEl = document.createElement("div");

      tileEl.className = "tile";
      if (tile.letter) tileEl.classList.add("filled");
      if (tile.status) tileEl.classList.add(tile.status);
      tileEl.textContent = tile.letter;

      rowEl.appendChild(tileEl);
    }

    boardEl.appendChild(rowEl);
  }
}

function renderKeyboard() {
  keyboardEl.innerHTML = "";

  for (const keys of KEY_ROWS) {
    const rowEl = document.createElement("div");
    rowEl.className = "key-row";

    for (const key of keys) {
      const button = document.createElement("button");
      button.className = key.length > 1 ? "wide-key" : "key";
      button.textContent = key;
      button.disabled = gameOver;

      const status = keyboardStatus[key.toLowerCase()];
      if (status) button.classList.add(status);

      button.addEventListener("click", () => handleKey(key));
      rowEl.appendChild(button);
    }

    keyboardEl.appendChild(rowEl);
  }
}

function renderMessage() {
  messageEl.textContent = lastOutcome;
}

function render() {
  renderBoard();
  renderKeyboard();
  renderMessage();
}

function setMessage(text) {
  lastOutcome = text;
  renderMessage();
  saveState();
}

function addLetter(letter) {
  if (gameOver || currentGuess.length >= WORD_LENGTH) return;

  currentGuess += letter.toLowerCase();
  board[currentRow][currentGuess.length - 1].letter = letter.toUpperCase();

  saveState();
  renderBoard();
}

function deleteLetter() {
  if (gameOver || currentGuess.length === 0) return;

  const index = currentGuess.length - 1;
  currentGuess = currentGuess.slice(0, -1);
  board[currentRow][index].letter = "";
  board[currentRow][index].status = "";

  saveState();
  renderBoard();
}

function updateKeyboard(guess, score) {
  for (let i = 0; i < guess.length; i++) {
    const letter = guess[i];
    const nextStatus = score[i];
    const previousStatus = keyboardStatus[letter] || "unknown";

    if (STATUS_RANK[nextStatus] > STATUS_RANK[previousStatus]) {
      keyboardStatus[letter] = nextStatus;
    }
  }
}

async function submitGuess() {
  if (gameOver) return;

  if (currentGuess.length !== WORD_LENGTH) {
    setMessage("Not enough letters.");
    return;
  }

  let data;

  try {
    data = await apiFetch("./api/guess", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ guess: currentGuess }),
    });
  } catch (error) {
    setMessage(error.message || "Invalid guess.");
    return;
  }

  const guess = data.guess;
  const score = data.score;

  guesses.push(guess);
  scores.push(score);

  for (let i = 0; i < WORD_LENGTH; i++) {
    board[currentRow][i].status = score[i];
  }

  updateKeyboard(guess, score);

  if (data.isCorrect) {
    gameOver = true;
    lastOutcome = `Solved in ${currentRow + 1}/${MAX_GUESSES}.`;
  } else if (currentRow + 1 >= MAX_GUESSES) {
    gameOver = true;

    try {
      const answerData = await apiFetch("./api/answer");
      lastOutcome = `Game over. The word was ${answerData.answer}.`;
    } catch {
      lastOutcome = "Game over.";
    }
  } else {
    currentRow += 1;
    currentGuess = "";
    lastOutcome = "";
  }

  saveState();
  render();
}

function handleKey(key) {
  if (key === "ENTER") {
    submitGuess();
    return;
  }

  if (key === "⌫") {
    deleteLetter();
    return;
  }

  addLetter(key);
}

function resultSquares(score) {
  return score
    .map((item) => {
      if (item === "correct") return "🟩";
      if (item === "present") return "🟨";
      return "⬛";
    })
    .join("");
}

async function copyResult() {
  const lines = [
    `4-Letter Wordle ${gameDate}`,
    `${guesses.length}/${MAX_GUESSES}`,
    "",
    ...scores.map(resultSquares),
  ];

  const text = lines.join("\n");

  try {
    await navigator.clipboard.writeText(text);
    setMessage("Result copied.");
  } catch {
    setMessage(text);
  }
}

async function revealAnswer() {
  try {
    const data = await apiFetch("./api/answer");
    gameOver = true;
    lastOutcome = `The word was ${data.answer}.`;
  } catch (error) {
    lastOutcome = `Could not reveal: ${error.message}`;
  }

  saveState();
  render();
}

function resetGame() {
  try {
    localStorage.removeItem(storageKey());
  } catch {}

  resetState();
  saveState();
  render();
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    submitGuess();
  } else if (event.key === "Backspace") {
    deleteLetter();
  } else if (/^[a-zA-Z]$/.test(event.key)) {
    addLetter(event.key.toUpperCase());
  }
});

newGameButton.addEventListener("click", resetGame);
shareButton.addEventListener("click", copyResult);
revealButton.addEventListener("click", revealAnswer);

async function main() {
  subtitleEl.textContent = "Loading game script...";

  const config = await getConfig();
  gameDate = config.date;

  const isInsideDiscord = new URLSearchParams(window.location.search).has("frame_id");
  subtitleEl.textContent = isInsideDiscord ? "Running inside Discord" : "Local preview mode";

  if (!loadState()) {
    resetState();
    saveState();
  }

  render();
}

main().catch((error) => {
  console.error(error);
  messageEl.textContent = `Failed to start: ${error.message}`;
});
    </script>
  </body>
</html>
