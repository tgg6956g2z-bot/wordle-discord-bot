<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>4-Letter Wordle Activity</title><link rel="stylesheet" href="./style.css"/></head>
<body><div id="app"><header><div><h1>WORDLE</h1><p id="subtitle">4-letter daily Discord Activity</p></div><button id="newGameButton" class="small-button">Reset</button></header>
<div class="player-panel"><input id="playerNameInput" maxlength="32" placeholder="Display name for result posts"/></div>
<main><section id="board" class="board" aria-label="Wordle board"></section><p id="message" class="message"></p><section id="keyboard" class="keyboard" aria-label="Keyboard"></section>
<section class="footer-actions"><button id="shareButton" class="action-button secondary">Copy Result</button><button id="postResultButton" class="action-button success">Post Result</button><button id="recapButton" class="action-button secondary">Post Recap</button><button id="revealButton" class="action-button danger">Reveal</button></section>
</main></div><script>
const MAX_GUESSES=6,WORD_LENGTH=4,STATUS_RANK={unknown:0,absent:1,present:2,correct:3},KEY_ROWS=["QWERTYUIOP".split(""),"ASDFGHJKL".split(""),["ENTER",..."ZXCVBNM".split(""),"⌫"]],STORAGE_PREFIX="discord-activity-wordle";
let gameDate="",wordleNumber="",webhookEnabled=false,board=[],guesses=[],scores=[],currentGuess="",currentRow=0,gameOver=false,keyboardStatus={},lastOutcome="",resultPosted=false,clientResultId="";
const boardEl=document.querySelector("#board"),keyboardEl=document.querySelector("#keyboard"),messageEl=document.querySelector("#message"),subtitleEl=document.querySelector("#subtitle"),newGameButton=document.querySelector("#newGameButton"),shareButton=document.querySelector("#shareButton"),revealButton=document.querySelector("#revealButton"),postResultButton=document.querySelector("#postResultButton"),recapButton=document.querySelector("#recapButton"),playerNameInput=document.querySelector("#playerNameInput");
async function apiFetch(path,options={}){const response=await fetch(path,options);if(!response.ok){let errorText=`HTTP ${response.status}`;try{const data=await response.json();errorText=data.error||errorText}catch{}throw new Error(errorText)}return response.json()}
function makeResultId(){return `${Date.now()}-${Math.random().toString(16).slice(2)}`}
function storageKey(){return `${STORAGE_PREFIX}:${gameDate}`}
function emptyBoard(){return Array.from({length:MAX_GUESSES},()=>Array.from({length:WORD_LENGTH},()=>({letter:"",status:""})))}
function getPlayerName(){return playerNameInput.value.trim()||"Anonymous"}
function savePlayerName(){try{localStorage.setItem(`${STORAGE_PREFIX}:playerName`,getPlayerName())}catch{}}
function loadPlayerName(){try{const saved=localStorage.getItem(`${STORAGE_PREFIX}:playerName`);if(saved)playerNameInput.value=saved}catch{}}
function resetState(){board=emptyBoard();guesses=[];scores=[];currentGuess="";currentRow=0;gameOver=false;keyboardStatus={};lastOutcome="";resultPosted=false;clientResultId=makeResultId()}
function saveState(){try{localStorage.setItem(storageKey(),JSON.stringify({board,guesses,scores,currentGuess,currentRow,gameOver,keyboardStatus,lastOutcome,resultPosted,clientResultId}))}catch{}}
function loadState(){let raw=null;try{raw=localStorage.getItem(storageKey())}catch{return false}if(!raw)return false;try{const s=JSON.parse(raw);board=s.board||emptyBoard();guesses=s.guesses||[];scores=s.scores||[];currentGuess=s.currentGuess||"";currentRow=s.currentRow||0;gameOver=!!s.gameOver;keyboardStatus=s.keyboardStatus||{};lastOutcome=s.lastOutcome||"";resultPosted=!!s.resultPosted;clientResultId=s.clientResultId||makeResultId();return true}catch{return false}}
function renderBoard(){boardEl.innerHTML="";for(let r=0;r<MAX_GUESSES;r++){const rowEl=document.createElement("div");rowEl.className="row";for(let c=0;c<WORD_LENGTH;c++){const tile=board[r][c],tileEl=document.createElement("div");tileEl.className="tile";if(tile.letter)tileEl.classList.add("filled");if(tile.status)tileEl.classList.add(tile.status);tileEl.textContent=tile.letter;rowEl.appendChild(tileEl)}boardEl.appendChild(rowEl)}}
function renderKeyboard(){keyboardEl.innerHTML="";for(const keys of KEY_ROWS){const rowEl=document.createElement("div");rowEl.className="key-row";for(const key of keys){const button=document.createElement("button");button.className=key.length>1?"wide-key":"key";button.textContent=key;button.disabled=gameOver;const status=keyboardStatus[key.toLowerCase()];if(status)button.classList.add(status);button.addEventListener("click",()=>handleKey(key));rowEl.appendChild(button)}keyboardEl.appendChild(rowEl)}}
function renderMessage(){messageEl.textContent=lastOutcome}
function renderActions(){postResultButton.disabled=!gameOver||resultPosted||!webhookEnabled;recapButton.disabled=!webhookEnabled}
function render(){renderBoard();renderKeyboard();renderMessage();renderActions()}
function setMessage(text){lastOutcome=text;renderMessage();saveState()}
function addLetter(letter){if(gameOver||currentGuess.length>=WORD_LENGTH)return;currentGuess+=letter.toLowerCase();board[currentRow][currentGuess.length-1].letter=letter.toUpperCase();saveState();renderBoard()}
function deleteLetter(){if(gameOver||currentGuess.length===0)return;const index=currentGuess.length-1;currentGuess=currentGuess.slice(0,-1);board[currentRow][index].letter="";board[currentRow][index].status="";saveState();renderBoard()}
function updateKeyboard(guess,score){for(let i=0;i<guess.length;i++){const l=guess[i],next=score[i],prev=keyboardStatus[l]||"unknown";if(STATUS_RANK[next]>STATUS_RANK[prev])keyboardStatus[l]=next}}
async function submitGuess(){if(gameOver)return;if(currentGuess.length!==WORD_LENGTH){setMessage("Not enough letters.");return}let data;try{data=await apiFetch("./api/guess",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guess:currentGuess})})}catch(e){setMessage(e.message||"Invalid guess.");return}const guess=data.guess,score=data.score;guesses.push(guess);scores.push(score);for(let i=0;i<WORD_LENGTH;i++)board[currentRow][i].status=score[i];updateKeyboard(guess,score);if(data.isCorrect){gameOver=true;lastOutcome=`Solved in ${currentRow+1}/${MAX_GUESSES}. Posting result...`;saveState();render();await postResult();return}if(currentRow+1>=MAX_GUESSES){gameOver=true;try{const a=await apiFetch("./api/answer");lastOutcome=`Game over. The word was ${a.answer}. Posting result...`}catch{lastOutcome="Game over. Posting result..."}saveState();render();await postResult();return}currentRow++;currentGuess="";lastOutcome="";saveState();render()}
function handleKey(key){if(key==="ENTER")return submitGuess();if(key==="⌫")return deleteLetter();addLetter(key)}
function resultSquares(score){return score.map(x=>x==="correct"?"🟩":x==="present"?"🟨":"⬛").join("")}
async function copyResult(){const text=[`4-Letter Wordle No. ${wordleNumber}`,`${guesses.length}/${MAX_GUESSES}`,"",...scores.map(resultSquares)].join("\n");try{await navigator.clipboard.writeText(text);setMessage("Result copied.")}catch{setMessage(text)}}
async function revealAnswer(){try{const d=await apiFetch("./api/answer");gameOver=true;lastOutcome=`The word was ${d.answer}. Posting result...`}catch{gameOver=true;lastOutcome="Revealed. Posting result..."}saveState();render();await postResult()}
async function postResult(){if(!gameOver)return setMessage("Finish the game before posting a result.");if(resultPosted)return setMessage("Result already posted.");if(!webhookEnabled)return setMessage("Webhook is not configured.");savePlayerName();const solved=guesses.length>0&&scores.length>0&&scores[scores.length-1].every(x=>x==="correct");try{await apiFetch("./api/result",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerName:getPlayerName(),guesses,scores,solved,guessCount:guesses.length,clientResultId})});resultPosted=true;lastOutcome=solved?`Solved in ${guesses.length}/${MAX_GUESSES}. Result posted.`:"Result posted."}catch(e){lastOutcome=`Could not post result: ${e.message}`}saveState();render()}
async function postRecap(){if(!webhookEnabled)return setMessage("Webhook is not configured.");try{const r=await apiFetch("./api/recap",{method:"POST"});setMessage(r.alreadyPosted?"Daily recap was already posted.":"Daily recap posted.")}catch(e){setMessage(`Could not post recap: ${e.message}`)}}
function resetGame(){try{localStorage.removeItem(storageKey())}catch{}resetState();saveState();render()}
document.addEventListener("keydown",e=>{if(e.key==="Enter")submitGuess();else if(e.key==="Backspace")deleteLetter();else if(/^[a-zA-Z]$/.test(e.key))addLetter(e.key.toUpperCase())});
newGameButton.addEventListener("click",resetGame);shareButton.addEventListener("click",copyResult);revealButton.addEventListener("click",revealAnswer);postResultButton.addEventListener("click",postResult);recapButton.addEventListener("click",postRecap);playerNameInput.addEventListener("change",savePlayerName);playerNameInput.addEventListener("blur",savePlayerName);
async function main(){subtitleEl.textContent="Loading game script...";loadPlayerName();const c=await apiFetch("./api/config");gameDate=c.date;wordleNumber=c.wordleNumber;webhookEnabled=!!c.webhookEnabled;const inDiscord=new URLSearchParams(window.location.search).has("frame_id");subtitleEl.textContent=`${inDiscord?"Running inside Discord":"Local preview mode"} • Wordle No. ${wordleNumber}`;if(!loadState()){resetState();saveState()}render()}
main().catch(e=>{console.error(e);messageEl.textContent=`Failed to start: ${e.message}`});
</script></body></html>
